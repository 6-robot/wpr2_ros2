wpr2_objects_3d:
  ros__parameters:
    auto_start: false
    object_min_height: 0.02
    cluster_tolerance: 0.03
    min_cluster_size: 30
    stable_frame_count: 3
    stable_distance_threshold: 0.05
    lock_radius: 0.10

wpr2_grab:
  ros__parameters:
    auto_start: false
    align_x: 0.7
    align_y: 0.0
    grab_y_offset: 0.0
    lift_reference_z: 1.1
    lift_reference_height: 0.7
    grab_lift_offset: 0.0
    grab_forward_range: 0.3
    grab_gripper_value: 0.06
    open_width: 0.15
    min_lift: 0.4
    max_lift: 0.7
    observe_lift: 0.5
    restore_lift: 0.7
    align_speed: 0.05
    forward_speed: 0.1
    joint_speed: 2000.0
    lift_speed: 15000.0
    reset_wait: 0.5
    stop_wait: 0.5
    ready_timeout: 10.0
    detection_timeout: 15.0
    joint_timeout: 45.0
    joint_feedback_timeout: 1.0
    pose_timeout: 1.0
    motion_timeout: 30.0
    total_timeout: 180.0
    grip_min_wait: 0.5
    grip_timeout: 5.0
    max_align_attempts: 5
    # Angles (rad) copied from ROS1 wpr2_grab_bottle.cpp; controller speeds are raw numbers.
    observe_right: [-0.6, 1.57, 0.0, 1.5, 0.0, 0.0]
    observe_left: [0.6, -1.57, 0.0, -1.5, 0.0, 0.0]
    ready_right: [1.4813, 1.5723, -1.5426, 1.3623, 1.4895, -1.3667]
    raise_right: [1.6673, 1.5699, -1.5818, 1.3601, 1.6793, -1.3631]
    hold_right: [-0.1593, 1.5128, -0.0382, 1.7225, 0.0637, 1.5130]
