moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names:
    - left_arm_lift_controller
    - right_arm_lift_controller
    - left_arm_controller
    - right_arm_controller
  left_arm_lift_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints: [chest_height, left_joint_1, left_joint_2, left_joint_3, left_joint_4, left_joint_5, left_joint_6]
  right_arm_lift_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints: [chest_height, right_joint_1, right_joint_2, right_joint_3, right_joint_4, right_joint_5, right_joint_6]
  left_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints: [left_joint_1, left_joint_2, left_joint_3, left_joint_4, left_joint_5, left_joint_6]
  right_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints: [right_joint_1, right_joint_2, right_joint_3, right_joint_4, right_joint_5, right_joint_6]
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.05
